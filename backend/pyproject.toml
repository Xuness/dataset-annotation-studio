[project]
name = "dataset-annotation-studio-backend"
version = "0.1.0"
description = "Local backend and durable worker for Dataset Annotation Studio"
license = "Apache-2.0"
authors = [{ name = "Xuness" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "filelock>=3.18,<4",
    "huggingface-hub>=1,<2",
    "httpx>=0.28,<1",
    "keyring>=25.6,<26",
    "numpy>=2,<3",
    "onnx>=1.17,<2",
    "openai-codex",
    "opencv-python-headless>=4.11,<5",
    "pillow>=11.3,<13",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.21,<1.27",
]
cuda = [
    "cupy-cuda12x>=14,<15",
    "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27",
    # cuDNN 9.11+ removed Volta support; keep Tesla V100 (SM 7.0) usable.
    "nvidia-cudnn-cu12>=9.10,<9.11",
]

[project.urls]
Homepage = "https://github.com/Xuness/dataset-annotation-studio"
Repository = "https://github.com/Xuness/dataset-annotation-studio"
Issues = "https://github.com/Xuness/dataset-annotation-studio/issues"

[project.scripts]
dataset-studio-api = "dataset_studio.entrypoints.api:main"
dataset-studio-worker = "dataset_studio.entrypoints.worker:main"
dataset-studio-service = "dataset_studio.entrypoints.service:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.15,<7",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
# Official Python SDK stable-release commit paired with Codex CLI 0.144.4.
openai-codex = { url = "https://github.com/openai/codex/archive/3f74f00295dcb1346340686bb09c5bfd4f0237c4.tar.gz", subdirectory = "sdk/python" }
