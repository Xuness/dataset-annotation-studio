<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 975" role="img" aria-labelledby="title description">
  <title id="title">Warm paper still life</title>
  <description id="description">An abstract composition of warm paper, a muted sun, and layered archive sheets.</description>
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ed" />
      <stop offset="0.58" stop-color="#eee7dc" />
      <stop offset="1" stop-color="#e8ded2" />
    </linearGradient>
    <linearGradient id="ambientLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.42" stop-color="#f5f1ea" stop-opacity="0" />
      <stop offset="0.76" stop-color="#f7dcc3" stop-opacity="0.34" />
      <stop offset="1" stop-color="#d7b79e" stop-opacity="0.12" />
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="2.2" r="0.55" fill="#584639" fill-opacity="0.12" />
      <circle cx="7" cy="6.4" r="0.42" fill="#8c7563" fill-opacity="0.09" />
    </pattern>
    <filter id="paperShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#473527" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1680" height="975" fill="#f5f1ea" />
  <rect width="1680" height="975" fill="url(#ambientLight)" />
  <path d="M0 750C370 710 602 748 872 716C1123 687 1371 594 1680 620V975H0Z" fill="#e9e1d6" fill-opacity="0.62" />
  <path d="M0 808C345 770 637 814 930 772C1194 734 1401 681 1680 696" fill="none" stroke="#756253" stroke-opacity="0.12" />

  <g transform="translate(850 146)">
    <path d="M0 0H642Q690 0 690 48V604H0Z" fill="url(#paperWash)" stroke="#8a7462" stroke-opacity="0.2" />
    <rect width="690" height="604" fill="url(#grain)" opacity="0.45" />
    <circle cx="541" cy="118" r="65" fill="#eecfb5" fill-opacity="0.66" stroke="#a0705d" stroke-opacity="0.38" />
    <circle cx="541" cy="118" r="78" fill="none" stroke="#b77f73" stroke-opacity="0.13" />
    <path d="M0 422H690" stroke="#756150" stroke-opacity="0.22" />
    <path d="M46 453H166" stroke="#b77f73" stroke-width="2" stroke-opacity="0.58" />
    <path d="M176 453H309" stroke="#756150" stroke-opacity="0.18" />

    <g filter="url(#paperShadow)" transform="translate(260 214) rotate(7 122 170)">
      <rect width="244" height="340" fill="#e3d5c6" stroke="#89725f" stroke-opacity="0.2" />
      <path d="M35 60H196M35 91H173M35 122H210" stroke="#765f4e" stroke-opacity="0.16" />
    </g>
    <g filter="url(#paperShadow)" transform="translate(350 190) rotate(-3 145 192)">
      <rect width="290" height="384" fill="#fbf7f0" stroke="#89725f" stroke-opacity="0.22" />
      <circle cx="52" cy="54" r="4" fill="#b77f73" />
      <path d="M74 54H223" stroke="#6e5949" stroke-opacity="0.28" />
      <path d="M38 105H248M38 139H220M38 173H251M38 207H192M38 275H244" stroke="#665143" stroke-opacity="0.2" />
      <path d="M38 310H134" stroke="#788979" stroke-width="2" stroke-opacity="0.55" />
    </g>
  </g>

  <g fill="#715b4b" fill-opacity="0.34">
    <circle cx="774" cy="318" r="2" />
    <circle cx="802" cy="318" r="2" />
    <path d="M781 318H795" stroke="#715b4b" stroke-opacity="0.25" />
  </g>
  <text x="790" y="713" fill="#715b4b" fill-opacity="0.26" font-family="Georgia, serif" font-size="11" letter-spacing="4">ARCHIVE / STUDY 01</text>
</svg>
