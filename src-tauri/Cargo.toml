[package]
name = "dataset-annotation-studio"
version = "0.1.0"
description = "A quiet desktop workspace for image dataset annotation"
authors = ["Dataset Annotation Studio Contributors"]
edition = "2021"

[lib]
name = "dataset_annotation_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["ApplicationModel_DataTransfer"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61.3", features = ["Win32_System_WinRT"] }

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
debug = 0
